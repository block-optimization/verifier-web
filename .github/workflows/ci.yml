name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 동일 브랜치의 이전 실행을 취소해 리소스 낭비를 막는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (tsc + vite build)
        # package.json 의 `build` = "tsc && vite build" 이므로 strict 타입체크 + prod build 동시 검증
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: verifier-web-dist-${{ github.sha }}
          path: dist
          retention-days: 14
          if-no-files-found: error
