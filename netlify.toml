# Netlify 배포 설정
#
# 이 파일은 verifier-web 을 Netlify 에 정적 호스팅할 때의 build · redirect · header 규칙이다.
# Backend CORS 미개방을 우회하기 위해 Netlify Edge 에서 `/api/*` 를 backend origin 으로
# proxy 한다. 브라우저는 same-origin 상대경로만 사용한다.

[build]
  # Vite prod build → dist/
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify 기본 Node 는 16 · 우리는 20 (package.json engines 와 일치)
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# Backend proxy — same-origin 위장으로 CORS 회피
#
# `VITE_USE_REAL_BACKEND=true` 로 세팅하면 프론트가 `/api/public/v1/emergency-access`
# 를 호출하고, 이 규칙이 그 요청을 backend origin 으로 forward 한다.
# `status = 200` + `force = true` = SPA 라우팅보다 우선. 실 backend proxy.
# `to` 값은 새 backend URL 로 바뀔 수 있으니 IP 변경 시 여기만 수정.
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "https://34-205-135-30.sslip.io/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/demo/*"
  to = "https://34-205-135-30.sslip.io/demo/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/*"
  to = "https://34-205-135-30.sslip.io/.well-known/:splat"
  status = 200
  force = true

# SPA fallback — Vite 는 단일 index.html 이라 알 수 없는 경로는 전부 index.html
# 로 서빙해서 클라이언트 라우팅이 처리하게 한다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# 보안 헤더 — PHI 를 다루는 웹은 iframe 금지 · MIME 스니핑 방지 · 카메라 등 권한 차단
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # 다른 사이트가 우리 앱을 iframe 으로 감싸는 걸 금지 (clickjacking 방지)
    X-Frame-Options = "DENY"
    # MIME 스니핑 금지
    X-Content-Type-Options = "nosniff"
    # 외부 링크로 갈 때 도메인만 넘김 (fragment · path · query 미노출)
    Referrer-Policy = "strict-origin-when-cross-origin"
    # 명시적으로 필요 없는 브라우저 권한 전부 차단
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    # 캐시 정책 — index.html 은 항상 fresh 여야 새 버전 배포가 즉시 반영됨
    Cache-Control = "public, max-age=0, must-revalidate"

# -----------------------------------------------------------------------------
# 정적 asset — Netlify 의 자동 MIME 추론이 nosniff 와 만나면 module script 로드가
# 실패할 수 있어 JS/CSS 는 Content-Type 을 명시적으로 지정한다.
# (Chrome: "Failed to load module script: MIME type application/octet-stream" 방지)
# -----------------------------------------------------------------------------
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

# 나머지 assets (폰트·이미지 등) 은 캐싱만 지정, Content-Type 은 Netlify 기본값 사용
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PDF 자료 — 응급 원문 참조. 이미 판본이 고정된 파일이라 장기 캐싱 가능
[[headers]]
  for = "/guides/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "application/pdf"
