# Netlify 배포 설정
#
# 이 파일은 verifier-web 을 Netlify 에 정적 호스팅할 때의 build · redirect · header 규칙이다.
# Backend CORS 미개방을 우회하기 위해 Netlify Edge 에서 `/api/*` 를 backend origin 으로
# proxy 한다. 브라우저는 same-origin 상대경로만 사용한다.

[build]
  # Vite prod build → dist/
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify 기본 Node 는 16 · 우리는 20 (package.json engines 와 일치)
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# Backend proxy — 최소 권한 원칙
#
# verifier-web 이 실제로 호출하는 endpoint 는 POST /api/public/v1/emergency-access
# 하나뿐이다 (src/api/emergencyAccess.ts 의 유일한 fetch).
#
# 이전에는 `/api/*` · `/demo/*` · `/.well-known/*` 를 통째로 forward 했는데,
# 그러면 배포 도메인이 백엔드 전체 API 의 공개 게이트웨이가 된다:
#   POST /demo/v1/tokens/patient  → 토큰 발급
#   GET  /api/patient/v1/profile  → 그 토큰으로 환자 전체 기록 열람
# 발견자에게 8건 중 2건만 보여준다는 이 앱의 전제와 정면으로 어긋나므로
# 공개 열람 경로만 남긴다. 나머지는 SPA fallback 으로 index.html 이 응답한다.
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/api/public/*"
  to = "https://api-175-45-193-221.sslip.io/api/public/:splat"
  status = 200
  force = true

# SPA fallback — Vite 는 단일 index.html 이라 알 수 없는 경로는 전부 index.html
# 로 서빙해서 클라이언트 라우팅이 처리하게 한다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# 보안 헤더 — PHI 를 다루는 웹은 iframe 금지 · MIME 스니핑 방지 · 카메라 등 권한 차단
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # 다른 사이트가 우리 앱을 iframe 으로 감싸는 걸 금지 (clickjacking 방지)
    X-Frame-Options = "DENY"
    # MIME 스니핑 금지
    X-Content-Type-Options = "nosniff"
    # 외부 링크로 갈 때 도메인만 넘김 (fragment · path · query 미노출)
    Referrer-Policy = "strict-origin-when-cross-origin"
    # 명시적으로 필요 없는 브라우저 권한 전부 차단
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    # CSP — 폰트 CDN 외 외부 리소스를 차단하고 프레이밍·플러그인을 금지한다.
    # connect-src 'self' 이므로 브라우저는 same-origin(Netlify redirect) 로만 API 를 호출한다.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    # 캐시 정책 — index.html 은 항상 fresh 여야 새 버전 배포가 즉시 반영됨
    Cache-Control = "public, max-age=0, must-revalidate"

# -----------------------------------------------------------------------------
# 정적 asset — Netlify 의 자동 MIME 추론이 nosniff 와 만나면 module script 로드가
# 실패할 수 있어 JS/CSS 는 Content-Type 을 명시적으로 지정한다.
# (Chrome: "Failed to load module script: MIME type application/octet-stream" 방지)
# -----------------------------------------------------------------------------
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

# 나머지 assets (폰트·이미지 등) 은 캐싱만 지정, Content-Type 은 Netlify 기본값 사용
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PDF 자료 — 응급 원문 참조. 이미 판본이 고정된 파일이라 장기 캐싱 가능
[[headers]]
  for = "/guides/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "application/pdf"
