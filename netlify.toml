# Netlify 배포 설정
#
# 이 파일은 verifier-web 을 Netlify 에 정적 호스팅할 때의 build · redirect · header 규칙이다.
# Backend CORS 미개방을 우회하기 위해 Netlify Edge 가 역지오코딩 경로 하나만 backend
# origin 으로 proxy 한다. 브라우저는 same-origin 상대경로만 사용한다.

[build]
  # Vite prod build → dist/
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify 기본 Node 는 16 · 우리는 20 (package.json engines 와 일치)
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# Backend proxy — 최소 권한 원칙
#
# verifier-web 이 호출하는 백엔드 경로는 역지오코딩 **하나뿐**이다
# (src/api/location.ts 의 유일한 fetch). 경로 하나만 열고 나머지는 SPA fallback 으로
# index.html 이 응답하게 둔다 — `/api/*` 를 통째로 forward 하면 이 배포 도메인이
# 백엔드 전체 API 의 공개 게이트웨이가 되기 때문이다.
#
# 폐지된 공개 환자조회(`/api/public/v1/card-sessions`, `/api/public/v1/emergency-access`,
# `report-complete`) 는 FE 코드에서 제거됐고, 여기서도 프록시하지 않는다
# (FE 수정요청서 2026-09-20 「구현 요청」 6항). 백엔드는 이 경로들에 410
# `PUBLIC_DISCLOSURE_RETIRED` 를 준다 — 그건 "환자가 카드를 철회함"이 아니라
# 기능 폐지를 뜻하므로, 실수로 살아나도 화면에 철회로 표시되지 않아야 한다.
#
# 네이버 Maps Client Secret 은 백엔드에만 있다. 예전엔 Netlify Function
# (netlify/functions/reverse-geocode.mts) 이 직접 NCP 를 호출해 이 배포에도 비밀키
# 사본이 필요했는데, 백엔드가 같은 계약으로 한글 주소를 응답하면서 함수를 걷어냈다.
# 비밀키를 두는 곳은 백엔드 한 군데로 유지한다.
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/api/public/v1/location/reverse-geocode"
  to = "https://api-175-45-193-221.sslip.io/api/public/v1/location/reverse-geocode"
  status = 200
  force = true

# SPA fallback — Vite 는 단일 index.html 이라 알 수 없는 경로는 전부 index.html
# 로 서빙해서 클라이언트 라우팅이 처리하게 한다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# 보안 헤더 — PHI 를 다루는 웹은 iframe 금지 · MIME 스니핑 방지 · 카메라 등 권한 차단
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # 다른 사이트가 우리 앱을 iframe 으로 감싸는 걸 금지 (clickjacking 방지)
    X-Frame-Options = "DENY"
    # MIME 스니핑 금지
    X-Content-Type-Options = "nosniff"
    # 외부 링크로 갈 때 도메인만 넘김 (fragment · path · query 미노출)
    Referrer-Policy = "strict-origin-when-cross-origin"
    # geolocation=(self) — 119 신고 화면이 발견자의 현재 위치를 요청한다(§ 119 신고
    # 중심 피봇). 예전엔 전부 차단이었는데, 그러면 이 origin 조차 위치를 못 물어봐서
    # 기능이 항상 조용히 실패한다. camera/microphone/payment/usb 는 계속 차단.
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    # CSP — 폰트 CDN 외 외부 리소스를 차단하고 프레이밍·플러그인을 금지한다.
    # Naver Maps(위치 지도 토글)를 위해 script/connect/img 에 Naver 도메인을 최소로 추가했다.
    # 배포 후 지도 타일이 안 뜨면 콘솔의 차단된 도메인을 확인해 여기 추가할 것.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://oapi.map.naver.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com data:; img-src 'self' data: https://oapi.map.naver.com https://map.pstatic.net https://simg.pstatic.net https://nrbe.map.naver.net https://ssl.pstatic.net; connect-src 'self' https://oapi.map.naver.com https://maps.apigw.ntruss.com https://naveropenapi.apigw.ntruss.com; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    # 캐시 정책 — index.html 은 항상 fresh 여야 새 버전 배포가 즉시 반영됨
    Cache-Control = "public, max-age=0, must-revalidate"

# -----------------------------------------------------------------------------
# 정적 asset — Netlify 의 자동 MIME 추론이 nosniff 와 만나면 module script 로드가
# 실패할 수 있어 JS/CSS 는 Content-Type 을 명시적으로 지정한다.
# (Chrome: "Failed to load module script: MIME type application/octet-stream" 방지)
# -----------------------------------------------------------------------------
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

# 나머지 assets (폰트·이미지 등) 은 캐싱만 지정, Content-Type 은 Netlify 기본값 사용
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PDF 자료 — 응급 원문 참조. 이미 판본이 고정된 파일이라 장기 캐싱 가능
[[headers]]
  for = "/guides/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "application/pdf"
